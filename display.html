<script>
    const urlParams = new URLSearchParams(window.location.search);
    const eventCode = urlParams.get('event') || "EA26-JKT";
    const eventName = urlParams.get('name') || "THE NATION'S FINEST";

    document.getElementById('standbyEventName').innerText = eventName;
    document.getElementById('dispEventTag').innerText = "WELCOME TO " + eventName.toUpperCase();

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfFvxF5nIADv6uwLXA9sDtJYZmdN10h2SpE5Pa2bz2_Im0c-i1Ckwxv_M6OOWXAvdX/exec";
    
    let isShowing = false;

    function pollFoyer() {
      if (isShowing) return;

      const pollUrl = APPS_SCRIPT_URL + "?action=pollDisplay&event=" + encodeURIComponent(eventCode) + "&t=" + Date.now();

      fetch(pollUrl)
        .then(res => res.json())
        .then(guest => {
          if (guest && guest.name) {
            isShowing = true;
            document.getElementById('dispName').innerText = guest.name;
            document.getElementById('dispCompany').innerText = guest.company || "-";
            document.getElementById('dispTable').innerText = guest.table || "UPON ARRIVAL";

            const card = document.getElementById('welcomeCard');
            card.classList.add('active');

            // DIPERCEPAT: Tampil selama 4 detik saja agar antrean cepat bergeser
            setTimeout(() => {
              card.classList.remove('active');
              setTimeout(() => {
                isShowing = false;
              }, 400);
            }, 4000);
          }
        })
        .catch(err => {});
    }

    // DIPERCEPAT: Polling server setiap 1.5 detik agar lebih responsif
    setInterval(pollFoyer, 1500);
  </script>
