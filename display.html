<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Display — Exquisite Media</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d4af37;
      --bg-dark: #060e1a;
      --navy-stub: #0f1c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg-dark);
      color: #ffffff;
      font-family: 'Inter', -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .foyer-standby-container {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-dark);
      overflow: hidden;
    }

    /* WELCOME POPUP CARD (MUNCUL SAAT TAMU SCAN) */
    .welcome-overlay {
      position: relative;
      z-index: 10;
      background: rgba(15, 28, 46, 0.95);
      border: 2px solid var(--gold);
      border-radius: 32px;
      padding: 48px 64px;
      text-align: center;
      max-width: 850px;
      width: 90%;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      transform: scale(0.9);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .welcome-overlay.active {
      transform: scale(1);
      opacity: 1;
    }
    .wel-sub {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--gold);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .wel-name {
      font-size: 3.2rem;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .wel-company {
      font-size: 1.25rem;
      color: #94a3b8;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .wel-table-box {
      background: rgba(212, 175, 55, 0.12);
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 20px;
      padding: 18px 32px;
      display: inline-block;
    }
    .wel-table-lbl {
      font-size: 0.75rem;
      font-weight: 800;
      color: #94a3b8;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .wel-table-val {
      font-size: 2rem;
      font-weight: 900;
      color: var(--gold);
      margin-top: 4px;
      letter-spacing: 0.02em;
    }

    .foyer-sync-status {
      position: fixed;
      bottom: 20px;
      left: 28px;
      font-size: 0.72rem;
      color: #64748b;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      z-index: 20;
    }
  </style>
</head>
<body>

  <!-- STANDBY MEDIA / CLEAN SCREEN (VIDEO / IMAGE BACKGROUND) -->
  <div id="standbyContainer" class="foyer-standby-container">
    <div id="standbyInner" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#64748b; text-transform:uppercase; letter-spacing:0.25em; font-size:0.9rem; z-index:2;">
      <div id="standbyTitle" style="font-size: 2rem; color: var(--gold); font-weight: 900; margin-bottom: 12px;">Exquisite Awards</div>
      <div>Awaiting Guest Arrival...</div>
    </div>
  </div>

  <!-- POPUP SAMBUTAN FOYER -->
  <div id="welcomeCard" class="welcome-overlay">
    <div id="dispEventTag" class="wel-sub">WELCOME TO EVENT</div>
    <div id="dispName" class="wel-name">Guest Name</div>
    <div id="dispCompany" class="wel-company">Company Name</div>
    <div class="wel-table-box">
      <div class="wel-table-lbl">TABLE ASSIGNED</div>
      <div id="dispTable" class="wel-table-val">UPON ARRIVAL</div>
    </div>
  </div>

  <div class="foyer-sync-status">
    ● LIVE FOYER SYNC ACTIVE
  </div>

  <script>
    // Ganti URL di bawah ini dengan Web App URL Google Apps Script Anda yang aktif
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxfFvxF5nIADv6uwLXA9sDtJYZmdN10h2SpE5Pa2bz2_Im0c-i1Ckwxv_M6OOWXAvdX/exec";
    
    const urlParams = new URLSearchParams(window.location.search);
    const eventCode = urlParams.get('event') || "EA26-JKT";

    // Tarik konfigurasi Event & Background/Video dari Google Sheet secara dinamis
    fetch(APPS_SCRIPT_URL + "?action=getEventConfig&event=" + encodeURIComponent(eventCode) + "&t=" + Date.now())
      .then(res => res.json())
      .then(ev => {
        if (ev && ev.name) {
          document.getElementById('standbyTitle').innerText = ev.name;
          document.getElementById('dispEventTag').innerText = "WELCOME TO " + ev.name.toUpperCase();
        }
        if (ev && ev.standbyImage) {
          const container = document.getElementById('standbyContainer');
          const mediaUrl = ev.standbyImage.trim();
          const isVideo = /\.(mp4|webm|mov|ogg)(\?.*)?$/i.test(mediaUrl) || mediaUrl.includes('video');

          if (isVideo) {
            container.innerHTML = `
              <video autoplay muted loop playsinline style="width:100%; height:100%; object-fit:cover; position:absolute; top:0; left:0; z-index:0;">
                <source src="${mediaUrl}" type="video/mp4">
                Your browser does not support the video tag.
              </video>
            `;
          } else {
            container.style.background = `url('${mediaUrl}') no-repeat center center`;
            container.style.backgroundSize = 'cover';
            document.getElementById('standbyInner').style.display = 'none';
          }
        }
      })
      .catch(err => console.error("Config load error", err));

    let isShowing = false;

    function pollFoyer() {
      if (isShowing) return;

      const pollUrl = APPS_SCRIPT_URL + "?action=pollDisplay&event=" + encodeURIComponent(eventCode) + "&t=" + Date.now();

      fetch(pollUrl)
        .then(res => res.json())
        .then(guest => {
          if (guest && guest.name) {
            isShowing = true;
            document.getElementById('dispName').innerText = guest.name;
            document.getElementById('dispCompany').innerText = guest.company || "-";
            document.getElementById('dispTable').innerText = guest.table || "UPON ARRIVAL";

            const card = document.getElementById('welcomeCard');
            card.classList.add('active');

            // Tampilkan selama 7 detik lalu sembunyikan
            setTimeout(() => {
              card.classList.remove('active');
              setTimeout(() => {
                isShowing = false;
              }, 600);
            }, 7000);
          }
        })
        .catch(err => {});
    }

    // Polling setiap 2 detik
    setInterval(pollFoyer, 2000);
  </script>
</body>
</html>
